name: Build Plugin

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[no ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore
        env:
          # InsanityGaming.* packages come from the org's GitHub Packages feed (nuget.config)
          GITHUB_PACKAGES_USER: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          dotnet build -c Release --no-restore \
            -p:Version=1.0.${{ github.run_number }} \
            -p:AssemblyVersion=1.0.${{ github.run_number }} \
            -p:FileVersion=1.0.${{ github.run_number }}

      - name: Copy build output
        run: |
          mkdir -p game/sharp/modules/store
          mkdir -p game/sharp/shared/InsanityGaming.Store.Shared
          cp Store/bin/Release/net10.0/Store.dll game/sharp/modules/store/Store.dll
          cp Store/bin/Release/net10.0/Store.deps.json game/sharp/modules/store/Store.deps.json
          cp Store.Shared/bin/Release/net10.0/InsanityGaming.Store.Shared.dll game/sharp/shared/InsanityGaming.Store.Shared/InsanityGaming.Store.Shared.dll
          cp Store.Shared/bin/Release/net10.0/InsanityGaming.Store.Shared.deps.json game/sharp/shared/InsanityGaming.Store.Shared/InsanityGaming.Store.Shared.deps.json

      - name: Copy examples
        run: |
          mkdir -p game/sharp/configs
          cp -r Store/examples/. game/sharp/configs/

      - name: Zip module
        run: zip -r module.zip game

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: ${{ github.ref_name == 'dev' }}
          files: module.zip
